name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickmail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the template is clean
        run: bun run check:clean

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

      - name: Configure production bindings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          sed "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/" \
            wrangler.production.jsonc > wrangler.deploy.jsonc
          ! grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID wrangler.deploy.jsonc

      - name: Apply production migrations
        run: bunx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy
        run: >-
          bunx wrangler deploy --config wrangler.deploy.jsonc --keep-vars
          --message "GitHub $GITHUB_SHA"
