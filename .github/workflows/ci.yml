name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Runs first: if a secret leaked, fail before anything else touches it.
      - name: Check the template is clean
        run: bun run check:clean

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: quickmail-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Configure production bindings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          sed "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/" \
            wrangler.production.jsonc > wrangler.deploy.jsonc
          ! grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID wrangler.deploy.jsonc

      - name: Build
        run: bun run build

      - name: Apply production migrations
        run: bunx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy
        run: >-
          bunx wrangler deploy --config wrangler.deploy.jsonc --keep-vars
          --message "GitHub $GITHUB_SHA"

  # Production catalogs: GT_API_KEY and GT_PROJECT_ID are repo Actions secrets.
  # Skipped on pull requests so forks never see credentials. On main (or a manual
  # run) the official GT action opens a PR with updated messages/*.json.
  translate:
    name: Translate catalogs
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]'
      && !contains(github.event.head_commit.message || '', 'gt-translate/')
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: generaltranslation/translate@v0
        with:
          gt_api_key: ${{ secrets.GT_API_KEY }}
          gt_project_id: ${{ secrets.GT_PROJECT_ID }}
          config: gt.config.json
          inline: false
          timeout: 3600
          pr_branch: gt-translate/${{ github.ref_name }}
          pr_title: Update UI translations from General Translation
